[workspace]
resolver = "2"
members = [
  "apps/server",
  "crates/domain",
  "crates/database",
  "crates/chmlfrp",
  "crates/cloudflare",
  "crates/frpc-log",
  "crates/frpc-runtime",
  "crates/failover",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"
repository = "https://github.com/ashanzzz/ashan-frp-control-center"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "sqlite-bundled", "macros", "migrate", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "sync", "time", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
