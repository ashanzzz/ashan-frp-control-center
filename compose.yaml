services:
  control-center:
    image: ghcr.io/ashanzzz/ashan-frp-control-center:latest
    container_name: ashan-frp-control-center
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
      DATABASE_URL: sqlite:///data/control-center.db
      WEB_DIR: /app/web
      FRPC_BINARY: /data/frpc/frpc
      FRPC_CONFIG: /data/frpc/frpc.ini
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
