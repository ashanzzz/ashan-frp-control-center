name: Build release artifact

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Linux amd64 release bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Product-invariant checks
        run: python3 scripts/verify.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl

      - name: Install musl build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version '^0.7' --locked

      - name: Build frontend
        run: dx build --release --platform web

      - name: Build portable backend
        run: cargo build --release -p ashan-frp-server --target x86_64-unknown-linux-musl

      - name: Assemble bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION="sha-${GITHUB_SHA::12}"
          fi
          ROOT="ashan-frp-control-center-${VERSION}-linux-amd64"
          mkdir -p "release/${ROOT}/web" "release/${ROOT}/unraid"
          cp target/x86_64-unknown-linux-musl/release/ashan-frp-server "release/${ROOT}/"
          cp -a dist/public/. "release/${ROOT}/web/"
          cp README.md CHANGELOG.md compose.yaml .env.example "release/${ROOT}/"
          cp unraid/ashan-frp-control-center.xml "release/${ROOT}/unraid/"
          (
            cd release
            tar -czf "${ROOT}.tar.gz" "${ROOT}"
            sha256sum "${ROOT}.tar.gz" > SHA256SUMS.txt
          )

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ashan-frp-control-center-linux-amd64-${{ github.sha }}
          path: |
            release/*.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
