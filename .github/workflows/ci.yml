name: CI and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ashan-frp-control-center-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    name: Test, build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Product invariant checks
        run: python3 scripts/verify.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --workspace --exclude ashan-frp-web

      - name: Rust check
        run: cargo check --workspace --exclude ashan-frp-web

      - name: Clippy
        run: cargo clippy --workspace --exclude ashan-frp-web --all-targets

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version '=0.7.9' --locked

      - name: Build Web/WASM
        run: ./scripts/build-web.sh

      - name: Build server
        run: cargo build --release -p ashan-frp-server

      - name: Stage verified runtime image
        run: ./scripts/stage-release.sh

      - name: Verify build outputs
        run: |
          set -euo pipefail
          test -x .release/ashan-frp-server
          test -f .release/web/index.html
          git diff --check

      - name: Upload release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ashan-frp-control-center-linux-amd64-${{ github.sha }}
          path: .release/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image and publish on main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
